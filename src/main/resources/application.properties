spring.application.name=prontus

spring.datasource.url=jdbc:postgresql://localhost:5433/prontus
spring.datasource.username=prontus
spring.datasource.password=prontus123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

spring.threads.virtual.enabled=true

spring.jpa.hibernate.ddl-auto=validate

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tags-sorter=alpha

jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=120

admin.username=admin
admin.password=${ADMIN_PASSWORD:admin-prontus-2026}