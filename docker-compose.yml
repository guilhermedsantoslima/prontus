services:
  postgres:
    image: postgres:16-alpine
    container_name: prontus-postgres
    environment:
      POSTGRES_DB: prontus
      POSTGRES_USER: prontus
      POSTGRES_PASSWORD: prontus123
    ports:
      - "5433:5432"
    volumes:
      - prontus-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: prontus-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - prontus-redisdata:/data

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: prontus-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEhBNVF4bVBrbU5xWQ

volumes:
  prontus-pgdata:
  prontus-redisdata: